name: jobradar

# NOTE: this showcase repo has no schedule trigger on purpose — config.json and
# secrets deliberately never live here, so scheduled runs would always fail.
# To run 24/7: make a PRIVATE fork, add your config.json + repo secrets, and
# re-add the schedule lines (see QUICKSTART.md step 6).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobradar-run
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Job Radar (LinkedIn only)
        env:
          JOB_RADAR_SMTP_USER: ${{ secrets.JOB_RADAR_SMTP_USER }}
          JOB_RADAR_SMTP_PASSWORD: ${{ secrets.JOB_RADAR_SMTP_PASSWORD }}
        run: |
          if [ ! -f config.json ]; then
            echo "No config.json in this repo — that is by design (secrets stay local)."
            echo "Follow QUICKSTART.md step 6 to set up your own private runner."
            exit 0
          fi
          python main.py run --source linkedin

      - name: Persist dedupe database
        run: |
          if [ ! -f data/jobradar.db ]; then
            echo "no database this run — nothing to persist"
            exit 0
          fi
          git config user.name "jobradar-bot"
          git config user.email "actions@github.com"
          git add -f data/jobradar.db
          git diff --cached --quiet || (git commit -m "db: run $(date -u +%FT%TZ)" && git push)
