name: jobradar

on:
  schedule:
    # Smart schedule (IST = UTC+5:30). This runner owns LinkedIn; the PC owns Naukri.
    # Daytime 8:05–22:05 IST, hourly: 02:35–16:35 UTC
    - cron: "35 2-16 * * *"
    # Overnight keep-alives 00:05 IST and 06:05 IST (morning digest before wake-up)
    - cron: "35 18,0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobradar-run
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Job Radar (LinkedIn only)
        env:
          JOB_RADAR_SMTP_USER: ${{ secrets.JOB_RADAR_SMTP_USER }}
          JOB_RADAR_SMTP_PASSWORD: ${{ secrets.JOB_RADAR_SMTP_PASSWORD }}
        run: python main.py run --source linkedin

      - name: Persist dedupe database
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@github.com"
          git add -f data/jobradar.db
          git diff --cached --quiet || (git commit -m "db: run $(date -u +%FT%TZ)" && git push)
